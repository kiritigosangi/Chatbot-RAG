services:
  - type: web
    name: sbi-mf-rag-chatbot
    runtime: docker
    repo: https://github.com/kiritigosangi/Chatbot-RAG.git
    plan: free
    envVars:
      - key: STORAGE
        value: neon
      - key: EMBEDDING_BACKEND
        value: fastembed
      - key: DATABASE_URL
        sync: false   # set this manually in the Render dashboard (secret)
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: mistral-small-latest
